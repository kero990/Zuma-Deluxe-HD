name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build in Debian container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v $PWD:/workspace \
            -w /workspace \
            debian:10 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y \
                build-essential \
                cmake \
                git \
                wget \
                curl \
                pkg-config \
                dpkg-dev \
                binutils \
                libsdl2-dev \
                libsdl2-image-dev \
                libsdl2-ttf-dev

              # Download BASS dependencies
              ./scripts/download_deps.sh

              # Build project
              mkdir -p build
              cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release
              make -j$(nproc)
              make install
            '

      - name: Get version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package for UOS/deepin
        env:
          PKG_NAME: io.github.kero990.zuma-deluxe-hd
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Create directory structure
          mkdir -p deb/DEBIAN
          mkdir -p deb/opt/apps/$PKG_NAME/files
          mkdir -p deb/opt/apps/$PKG_NAME/entries/applications
          mkdir -p deb/opt/apps/$PKG_NAME/entries/icons/hicolor/256x256/apps

          # Copy game files
          cp -r build/install/* deb/opt/apps/$PKG_NAME/files/

          # Copy metadata files
          cp assets/$PKG_NAME/control deb/DEBIAN/control
          cp assets/$PKG_NAME/info deb/opt/apps/$PKG_NAME/
          cp assets/$PKG_NAME/zuma-deluxe.desktop deb/opt/apps/$PKG_NAME/entries/applications/
          cp assets/$PKG_NAME/$PKG_NAME.png deb/opt/apps/$PKG_NAME/entries/icons/hicolor/256x256/apps/

          # Replace version and architecture placeholders
          sed -i "s/VVVV/$VERSION/g" deb/DEBIAN/control
          sed -i "s/AAAA/$ARCH/g" deb/DEBIAN/control
          sed -i "s/VVVV/$VERSION/g" deb/opt/apps/$PKG_NAME/info
          sed -i "s/\"AAAA\"/\"$ARCH\"/g" deb/opt/apps/$PKG_NAME/info

          # Calculate installed size
          INSTALLED_SIZE=$(du -sk deb/opt | cut -f1)
          sed -i "s/50000/$INSTALLED_SIZE/g" deb/DEBIAN/control

          # Set permissions
          chmod -R 755 deb/opt/apps/$PKG_NAME/files
          chmod 644 deb/opt/apps/$PKG_NAME/entries/applications/*.desktop
          chmod 644 deb/opt/apps/$PKG_NAME/entries/icons/hicolor/256x256/apps/*.png
          chmod 644 deb/opt/apps/$PKG_NAME/info
          chmod 755 deb/opt/apps/$PKG_NAME/files/*.sh

          # Build deb package
          dpkg-deb --build deb ${PKG_NAME}_${VERSION}_${ARCH}.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-package
          path: '*.deb'

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Download AMD64 package
        uses: actions/download-artifact@v4
        with:
          name: amd64-package
          path: packages/

      - name: Download ARM64 package
        uses: actions/download-artifact@v4
        with:
          name: arm64-package
          path: packages/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: packages/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
